services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mediconnect
      POSTGRES_USER: mediconnect_dev
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - mediconnect_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediconnect_dev -d mediconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - mediconnect_redis:/data
volumes:
  mediconnect_pg:
  mediconnect_redis:
